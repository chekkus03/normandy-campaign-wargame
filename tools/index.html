<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Normandy Campaign Wargame</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a1f;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #84cc16;
            --accent-hover: #65a30d;
            --border-color: #2e3742;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .view-section {
            width: 100%;
            max-width: 900px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0b0c10;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.85rem;
            text-align: center;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            gap: 0.5rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="view-section">
        <a href="../" class="back-link">← Back to Main Menu</a>
        <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Tools</h2>
        <div class="grid">
            <div class="card">
                <div>
                    <h2>Campaign Manager</h2>
                    <p>All ledgerkeeping for the game is done here.</p>
                </div>
                <a href="./campaign-manager/" class="btn">Go</a>
            </div>

            <div class="card">
                <div>
                    <h2>Unit Token Builder</h2>
                    <p>Create tokens for your units from an imported roster file.</p>
                </div>
                <a href="./unit-token-builder/" class="btn">Go</a>
            </div>
        </div>
    </div>

</body>
</html>
